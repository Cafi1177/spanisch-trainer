<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanisch-Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #f8fbff, #eaf2ff);
  color: #0f1b4c;
}

.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 28px 18px 90px;
}

.header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 26px;
}

.logo {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: linear-gradient(135deg, #2563eb, #60a5fa);
  font-size: 34px;
  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
}

h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.05;
}

.subtitle {
  margin-top: 6px;
  color: #64748b;
  font-size: 16px;
}

.card {
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e0e7ff;
  border-radius: 28px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 18px 40px rgba(30, 64, 175, 0.12);
}

.label {
  display: block;
  margin-bottom: 12px;
  color: #2563eb;
  font-size: 20px;
  font-weight: 800;
}

select,
input {
  width: 100%;
  min-height: 58px;
  border: 2px solid #dbeafe;
  border-radius: 18px;
  padding: 0 16px;
  background: white;
  color: #0f1b4c;
  font-size: 18px;
}

input {
  margin-top: 14px;
}

.task-card {
  position: relative;
  overflow: hidden;
  min-height: 250px;
  border-left: 5px solid #2563eb;
  background:
    radial-gradient(circle at 82% 32%, #fde68a 0 34px, transparent 35px),
    linear-gradient(135deg, #ffffff, #eff6ff);
}

.tag {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: #dbeafe;
  color: #2563eb;
  font-weight: 800;
  margin-bottom: 22px;
}

.deutsch {
  position: relative;
  z-index: 2;
  font-size: 31px;
  line-height: 1.18;
  font-weight: 900;
  max-width: 86%;
}

.decoration {
  position: absolute;
  right: 18px;
  bottom: 16px;
  font-size: 72px;
  opacity: 0.23;
}
.answer-card {
  margin-top: -4px;
}

.button {
  width: 100%;
  min-height: 62px;
  border: 0;
  border-radius: 18px;
  margin-top: 14px;
  color: white;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 12px 24px rgba(30, 64, 175, 0.2);
}

.check-button {
  background: linear-gradient(135deg, #16a34a, #15803d);
}

.next-button {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.next-button:disabled {
  background: #cbd5e1;
  cursor: not-allowed;
  box-shadow: none;
}

.ergebnis {
  display: none;
  margin-top: 16px;
  padding: 16px;
  border-radius: 18px;
  font-size: 17px;
  line-height: 1.45;
}

.ergebnis.show {
  display: block;
}

.richtig {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #86efac;
}

.falsch {
  background: #fff7ed;
  color: #9a3412;
  border: 1px solid #fed7aa;
}

.loesung {
  margin-top: 10px;
  font-weight: 900;
  color: #0f1b4c;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  padding: 16px;
  border-radius: 22px;
  background: #f8fbff;
  border: 1px solid #e0e7ff;
}

.stat-title {
  color: #64748b;
  font-size: 14px;
  font-weight: 700;
}

.stat-value {
  margin-top: 4px;
  font-size: 24px;
  font-weight: 900;
}

.progress-bar {
  height: 8px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: #e5e7eb;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: #2563eb;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 14px 18px 18px;
  background: rgba(255, 255, 255, 0.94);
  border-top: 1px solid #e5e7eb;
}

.bottom-nav div:first-child {
  color: #2563eb;
}

@media (max-width: 430px) {
  .app {
    padding: 24px 14px 86px;
  }

  h1 {
    font-size: 28px;
  }

  .deutsch {
    font-size: 26px;
    max-width: 94%;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo">🇪🇸</div>
      <div>
        <h1>Spanisch-Trainer</h1>
        <div class="subtitle">Täglich üben. Schritt für Schritt besser werden ✨</div>
      </div>
    </header>

    <section class="card">
      <label class="label">📘 Kapitel wählen</label>
      <select id="kapitelSelect" onchange="kapitelLaden()"></select>
    </section>

    <section class="card task-card">
      <div class="tag">Übersetze ins Spanische</div>
      <div class="deutsch" id="deutsch">Lade...</div>
      <div class="decoration">🏰</div>
    </section>

    <section class="card answer-card">
      <label class="label">Deine spanische Übersetzung ✏️</label>
      <input id="antwort" placeholder="Schreibe hier deine Antwort...">

      <button class="button check-button" onclick="pruefen()">✓ Prüfen</button>

      <button class="button next-button" id="nextButton" onclick="naechsteAufgabe()" disabled>
        → Nächste Aufgabe
      </button>

      <div id="ergebnis" class="ergebnis"></div>
    </section>  
    <section class="card stats">
  <div class="stat">
    <div class="stat-title">🎯 Fortschritt</div>
    <div class="stat-value" id="fortschritt">0 / 0</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="stat">
    <div class="stat-title">🔥 Richtig</div>
    <div class="stat-value" id="richtigZaehler">0</div>
    <div class="progress-bar">
      <div class="progress-fill" id="richtigFill"></div>
    </div>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <div>🏠<br>Üben</div>
  <div>📊<br>Statistik</div>
  <div>⚙️<br>Einstellungen</div>
</nav>

<script>
const supabaseUrl = "https://evbzpargptfdchixspkx.supabase.co";
const supabaseKey = "sb_publishable_KdQ0BVd76hGX-Zw8El3iag_0Mobqt2N";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let aufgaben = [];
let aktuelleAufgabe = 0;
let richtigAnzahl = 0;
let aktuelleAufgabeRichtig = false;

function normalisieren(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[.!?¿¡,;:]/g, "")
    .replace(/\s+/g, " ");
}

function anzeigen() {
  if (aufgaben.length === 0) {
    document.getElementById("deutsch").innerText = "Keine Aufgaben gefunden.";
    return;
  }

  aktuelleAufgabeRichtig = false;

  document.getElementById("deutsch").innerText = aufgaben[aktuelleAufgabe].deutsch;
  document.getElementById("antwort").value = "";
  document.getElementById("ergebnis").className = "ergebnis";
  document.getElementById("ergebnis").innerHTML = "";
  document.getElementById("nextButton").disabled = true;

  statistikAktualisieren();
  document.getElementById("antwort").focus();
}

function pruefen() {
  const eingabe = document.getElementById("antwort").value;
  const richtig = aufgaben[aktuelleAufgabe].spanisch;

  const eingabeNormal = normalisieren(eingabe);
  const richtigNormal = normalisieren(richtig);

  const ergebnis = document.getElementById("ergebnis");

  if (eingabeNormal === richtigNormal) {
    ergebnis.className = "ergebnis richtig show";
    ergebnis.innerHTML = "✅ Richtig! Jetzt darfst du zur nächsten Aufgabe.";

    if (!aktuelleAufgabeRichtig) {
      richtigAnzahl++;
      aktuelleAufgabeRichtig = true;
    }

    document.getElementById("nextButton").disabled = false;
    statistikAktualisieren();
    return;
  }

  ergebnis.className = "ergebnis falsch show";
  ergebnis.innerHTML =
    "❌ Noch nicht ganz richtig. Schau dir die Lösung an und gib dieselbe Aufgabe nochmal ein." +
    "<div class='loesung'>Richtige Lösung:<br>" + richtig + "</div>" +
    "<div class='loesung'>Deine Antwort:<br>" + eingabe + "</div>";

  document.getElementById("antwort").value = "";
  document.getElementById("nextButton").disabled = true;
  document.getElementById("antwort").focus();
}

function naechsteAufgabe() {
  if (!aktuelleAufgabeRichtig) {
    return;
  }

  aktuelleAufgabe++;

  if (aktuelleAufgabe >= aufgaben.length) {
    aktuelleAufgabe = 0;
  }

  anzeigen();
}

function statistikAktualisieren() {
  const gesamt = aufgaben.length;
  const position = gesamt === 0 ? 0 : aktuelleAufgabe + 1;
  const fortschrittProzent = gesamt === 0 ? 0 : (position / gesamt) * 100;
  const richtigProzent = gesamt === 0 ? 0 : (richtigAnzahl / gesamt) * 100;

  document.getElementById("fortschritt").innerText = position + " / " + gesamt;
  document.getElementById("richtigZaehler").innerText = richtigAnzahl;
  document.getElementById("progressFill").style.width = fortschrittProzent + "%";
  document.getElementById("richtigFill").style.width = richtigProzent + "%";
}

async function kapitelLaden() {
  const kapitel = document.getElementById("kapitelSelect").value;

  const { data, error } = await supabaseClient
    .from("Vokabeln")
    .select("*")
    .eq("kapitel", kapitel)
    .eq("aktiv", true);

  if (error) {
    document.getElementById("deutsch").innerText = "Fehler beim Laden.";
    return;
  }

  aufgaben = data;
  aktuelleAufgabe = 0;
  richtigAnzahl = 0;
  anzeigen();
}

async function kapitelListeLaden() {
  const { data, error } = await supabaseClient
    .from("Vokabeln")
    .select("kapitel")
    .eq("aktiv", true);

  if (error) {
    document.getElementById("kapitelSelect").innerHTML =
      "<option>Fehler beim Laden</option>";
    return;
  }

  const kapitelEinzigartig = [...new Set(data.map(e => e.kapitel))];

  const select = document.getElementById("kapitelSelect");
  select.innerHTML = "";

  kapitelEinzigartig.forEach(kapitel => {
    const option = document.createElement("option");
    option.value = kapitel;
    option.textContent = kapitel;
    select.appendChild(option);
  });

  kapitelLaden();
}

document.getElementById("antwort").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    pruefen();
  }
});

kapitelListeLaden();
</script>

</body>
</html>
